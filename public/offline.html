<!doctype html>
<html lang="te">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f8f4e" />
    <title>రైతు నేస్తం — ఇంటర్నెట్ లేదు</title>
    <style>
      :root {
        --bg: #f7faf3;
        --card: #ffffff;
        --text: #1d2a21;
        --muted: #5b6b60;
        --primary: #2f8f4e;
        --on-primary: #ffffff;
        --border: #dfe7dc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1712;
          --card: #16241b;
          --text: #e7efe9;
          --muted: #9db0a3;
          --border: #24372b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: "Noto Sans Telugu", system-ui, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--card);
        text-align: center;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.06);
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 6px;
        line-height: 1.6;
        color: var(--muted);
      }
      button {
        margin-top: 20px;
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 14px;
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/icon-192.png" alt="" />
      <h1>ఇంటర్నెట్ లేదు</h1>
      <p>కనెక్షన్ వచ్చాక మళ్లీ ప్రయత్నించండి.</p>
      <p>You're offline. Please try again when connected.</p>
      <button type="button" onclick="location.reload()">
        మళ్లీ ప్రయత్నించండి
      </button>
    </main>
  </body>
</html>
